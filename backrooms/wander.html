<!DOCTYPE html>
<html>
<head>
  <title>wander</title>

<style>
  body {
    text-align: center;
    font-family: Georgia, serif;
    background-color: black;
    color: white;
  }

  h2 {
    margin-top: 30px;
  }

  .image-container {
    width: 400px;
    height: 400px; /* fixed frame size */
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* keeps images inside box */
  }

  .image-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain; /* keeps full image visible without stretching */
  }

 button {
  margin: 10px;
  padding: 10px 20px;
  font-size: 16px;
  background-color: black;
  color: white;        /* makes text visible */
  border: none;        /* optional: removes border */
  cursor: pointer;     /* makes it feel clickable */
}
  }
</style>
</head>

<body style="background-color:black;">

<h2>wander</h2>

<div class="image-container">
  <img id="slide" src="windows0.jpg">
</div>

<br>

<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>

<script>
  var images = ["windows0.jpg", "windows1.jpg", "windows3.jpg", "windows2.jpg"];
  var index = 0;

  function showImage() {
    document.getElementById("slide").src = images[index];
  }

  function next() {
    index = (index + 1) % images.length;
    showImage();
  }

  function prev() {
    index = (index - 1 + images.length) % images.length;
    showImage();
  }
</script>

 <link rel="icon" type="image/jpg" href="windows0.jpg"

</body>

<p style="text-align:center; font-family: Georgia, serif;">

</p>

</html>
