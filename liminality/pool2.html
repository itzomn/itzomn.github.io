<!DOCTYPE html>
<html>
<head>
  <title>calm</title>

<style>
  body {
    text-align: center;
    font-family: Georgia, serif;
    background-color: #99A8A5;
    color: black;
  }

  h2 {
    margin-top: 30px;
  }

  .image-container {
    width: 400px;
    height: 400px; /* fixed frame size */
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* keeps images inside box */
  }

  .image-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain; /* keeps full image visible without stretching */
  }

 button {
  margin: 10px;
  padding: 10px 20px;
  font-size: 16px;
  background-color: #99A8A5;
  color: white;        /* makes text visible */
  border: none;        /* optional: removes border */
  cursor: pointer;     /* makes it feel clickable */
}
  }
</style>
</head>

<body style="background-color:#99A8A5;">

<h2>calming</h2>

<div class="image-container">
  <img id="slide" src="pool1.jpg">
</div>

<br>

<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>

<script>
  var images = ["pool1.jpg", "pool2.jpg", "pool3.jpg", "pool4.jpg", "pool5.jpg", "pool6.jpg", "pool8.jpg", "pool9.jpg"];
  var index = 0;

  function showImage() {
    document.getElementById("slide").src = images[index];
  }

  function next() {
    index = (index + 1) % images.length;
    showImage();
  }

  function prev() {
    index = (index - 1 + images.length) % images.length;
    showImage();
  }
</script>

 <link rel="icon" type="image/jpg" href="pool1.jpg"

</body>

<p style="text-align:center; font-family: Georgia, serif;">
  <a href="pool3.html" style="color:black; margin:0 10px;">so endless</a>
</p>

</html>
